name: One-time lockfile bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install
        run: npm ci --no-audit --no-fund
      - name: Validate tests and build
        run: npm run check
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already committed"
            exit 0
          fi
          git commit -m "chore: pin npm dependency graph"
          git push origin HEAD:main
